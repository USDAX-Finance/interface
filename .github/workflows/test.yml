name: CI

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "contracts/**"
      - "artifacts/keeper/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "contracts/**"
      - "artifacts/keeper/**"
      - ".github/workflows/test.yml"

jobs:
  # ── Solidity / Foundry ────────────────────────────────────────────────────
  forge-test:
    name: Foundry Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install

      - name: Build
        run: forge build --sizes

      - name: Run unit tests
        run: forge test --match-path "test/*.t.sol" -v

      - name: Run fuzz tests (500 runs)
        run: forge test --match-contract "Fuzz" --fuzz-runs 500 -v

      - name: Run invariant tests (50 runs × 500 depth)
        run: |
          forge test \
            --match-contract "Invariant" \
            --invariant-runs 50 \
            --invariant-depth 500 \
            -v

      - name: Check gas snapshots
        run: forge snapshot --check
        continue-on-error: true   # warn only — do not block CI on snapshot drift

  # ── Keeper — TypeScript typecheck ────────────────────────────────────────
  keeper-typecheck:
    name: Keeper TypeScript Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck keeper
        run: pnpm --filter @workspace/keeper run typecheck
